services:
  mysql:
    image: mysql:8.0
    container_name: campushub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root@User
      MYSQL_DATABASE: campushub
      MYSQL_USER: campushub_user
      MYSQL_PASSWORD: Aathi@2004
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot@User"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
