services:
  # ==========================================
  # Database Service (MySQL 8.0)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: campushub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root@User
      MYSQL_DATABASE: campushub
      MYSQL_USER: campushub_user
      MYSQL_PASSWORD: Aathi@2004
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot@User"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - campushub-network

  # ==========================================
  # Backend API Service (Fastify 5 + Prisma 7)
  # ==========================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: campushub-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: mysql://campushub_user:Aathi%402004@mysql:3306/campushub
      JWT_SECRET: super_secure_production_jwt_secret_campushub_2026_xyz
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 7
      COOKIE_SECRET: super_secure_production_cookie_secret_campushub_2026_xyz
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campushub-network

  # ==========================================
  # Frontend Web Service (React 19 + Vite + Nginx)
  # ==========================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    container_name: campushub-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - campushub-network

volumes:
  mysql_data:

networks:
  campushub-network:
    driver: bridge
